# NVIDIA GPU override. Needs the NVIDIA Container Toolkit on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Builds a separate image (virex-ml:cuda) with CUDA wheels of torch.
# Adjust cu124 to match the driver (see https://pytorch.org/get-started/locally/).

x-gpu: &gpu
  image: virex-ml:cuda
  build:
    context: .
    dockerfile: ml-service/Dockerfile
    args:
      TORCH_INDEX: https://download.pytorch.org/whl/cu124
  deploy:
    resources:
      reservations:
        devices:
          - { driver: nvidia, count: 1, capabilities: [gpu] }

services:
  detector:
    <<: *gpu
    environment:
      VIREX_DEVICE: cuda:0
  ocr:
    <<: *gpu
    environment:
      VIREX_DEVICE: cuda:0
